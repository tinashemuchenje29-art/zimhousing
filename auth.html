<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZimHousing - User Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        <div class="text-center mb-6">
            <h1 id="formTitle" class="text-2xl font-bold text-emerald-700">User Login</h1>
            <p class="text-gray-500 text-sm mt-1">Harare Student & Property Housing</p>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
            <div id="nameField" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
            </div>
            <div id="errorMsg" class="text-red-500 text-sm hidden"></div>
            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition">Login</button>
        </form>

        <div class="mt-4 text-center">
            <button onclick="toggleMode()" id="toggleBtn" class="text-sm text-emerald-600 hover:underline">Need an account? Register</button>
        </div>
    </div>

    <script>
        let isRegistering = false;

        function toggleMode() {
            isRegistering = !isRegistering;
            document.getElementById('formTitle').textContent = isRegistering ? "Create Account" : "User Login";
            document.getElementById('submitBtn').textContent = isRegistering ? "Register" : "Login";
            document.getElementById('toggleBtn').textContent = isRegistering ? "Already have an account? Login" : "Need an account? Register";
            document.getElementById('nameField').classList.toggle('hidden', !isRegistering);
            document.getElementById('errorMsg').classList.add('hidden');
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            
            let users = JSON.parse(localStorage.getItem('zimUsers')) || [];

            if (isRegistering) {
                const name = document.getElementById('fullName').value;
                if (users.some(u => u.email === email)) {
                    errorDiv.textContent = "An account with this email already exists.";
                    errorDiv.classList.remove('hidden');
                    return;
                }
                users.push({ name, email, password });
                localStorage.setItem('zimUsers', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify({ name, email }));
                alert("Account created successfully!");
                window.location.href = "index.html";
            } else {
                const user = users.find(u => u.email === email && u.password === password);
                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify({ name: user.name, email: user.email }));
                    window.location.href = "index.html";
                } else {
                    errorDiv.textContent = "Invalid email or password.";
                    errorDiv.classList.remove('hidden');
                }
            }
        }
    </script>
</body>
</html>
