<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZimHousing - Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm">
        <h2 id="formTitle" class="text-2xl font-bold text-emerald-700 mb-6 text-center">User Login</h2>
        
        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
            </div>
            <div id="errorMsg" class="text-red-500 text-sm hidden"></div>
            
            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700 transition">Login</button>
        </form>

        <div class="mt-4 text-center">
            <button onclick="toggleMode()" id="toggleBtn" class="text-sm text-emerald-600 hover:underline">Need an account? Register</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your Firebase configuration (Replace with your own project credentials from Firebase Console)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isRegistering = false;

        window.toggleMode = function() {
            isRegistering = !isRegistering;
            document.getElementById('formTitle').innerText = isRegistering ? "Create Account" : "User Login";
            document.getElementById('submitBtn').innerText = isRegistering ? "Register" : "Login";
            document.getElementById('toggleBtn').innerText = isRegistering ? "Already have an account? Login" : "Need an account? Register";
        }

        window.handleAuth = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            try {
                if (isRegistering) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert("Account created successfully!");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    alert("Logged in successfully!");
                }
                window.location.href = "index.html"; // Redirect back to homepage after login
            } catch (error) {
                errorMsg.innerText = error.message;
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
